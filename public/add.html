<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Добавить сотрудника</title>
		<link rel="stylesheet" href="assets/css/style.css" />
	</head>
	<body>
		<div class="container">
			<h1>Добавить сотрудника</h1>

			<form id="addForm">
				<div class="form-group">
					<label>ФИО:</label>
					<input type="text" id="fullName" required />
				</div>

				<div class="form-group">
					<label>Дата рождения:</label>
					<input type="date" id="birthDate" required />
				</div>

				<div class="form-group">
					<label>Паспорт (серия/номер):</label>
					<input type="text" id="passport" placeholder="1234 567890" required />
				</div>

				<div class="form-group">
					<label>Контактная информация:</label>
					<input
						type="text"
						id="contactInfo"
						placeholder="+7 (999) 123-45-67"
						required
					/>
				</div>

				<div class="form-group">
					<label>Адрес проживания:</label>
					<textarea id="address" rows="2" required></textarea>
				</div>

				<div class="form-group">
					<label>Отдел:</label>
					<input type="text" id="department" required />
				</div>

				<div class="form-group">
					<label>Должность:</label>
					<input type="text" id="position" required />
				</div>

				<div class="form-group">
					<label>Зарплата (₽):</label>
					<input type="number" id="salary" step="1000" required />
				</div>

				<div class="form-group">
					<label>Дата принятия на работу:</label>
					<input type="date" id="hireDate" required />
				</div>

				<div class="form-actions">
					<button type="submit" class="btn btn-primary">💾 Добавить</button>
					<button
						type="button"
						class="btn"
						onclick="window.location.href = '/'"
					>
						Отмена
					</button>
				</div>
			</form>
		</div>

		<script>
			document.getElementById('addForm').addEventListener('submit', async e => {
				e.preventDefault()

				const employeeData = {
					full_name: document.getElementById('fullName').value,
					birth_date: document.getElementById('birthDate').value,
					passport: document.getElementById('passport').value,
					contact_info: document.getElementById('contactInfo').value,
					address: document.getElementById('address').value,
					department: document.getElementById('department').value,
					position: document.getElementById('position').value,
					salary: document.getElementById('salary').value,
					hire_date: document.getElementById('hireDate').value,
				}

				try {
					const response = await fetch('/api/employees', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(employeeData),
					})

					if (response.ok) {
						alert('Сотрудник добавлен!')
						window.location.href = '/'
					} else {
						const error = await response.json()
						alert('Ошибка: ' + error.error)
					}
				} catch (error) {
					console.error('Ошибка добавления:', error)
					alert('Не удалось добавить сотрудника')
				}
			})
		</script>

		<style>
			.form-group {
				margin-bottom: 15px;
			}
			.form-group label {
				display: block;
				margin-bottom: 5px;
				font-weight: 500;
				color: #d44e6c;
			}
			.form-group input,
			.form-group textarea,
			.form-group select {
				width: 100%;
				padding: 8px 12px;
				border: 2px solid #ffe4ec;
				border-radius: 8px;
				font-size: 14px;
			}
			.form-group input:focus,
			.form-group textarea:focus {
				border-color: #ff69b4;
				outline: none;
			}
			.form-actions {
				display: flex;
				gap: 10px;
				margin-top: 20px;
			}
			textarea {
				resize: vertical;
			}
		</style>
	</body>
</html>
