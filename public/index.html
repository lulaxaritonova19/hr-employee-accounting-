<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>HR Учет сотрудников</title>
		<link rel="stylesheet" href="assets/css/style.css" />
	</head>
	<body>
		<div class="container">
			<h1>📋 Учет сотрудников</h1>
			<div class="actions">
				<button
					class="btn btn-primary"
					onclick="window.location.href = 'add.html'"
				>
					➕ Добавить сотрудника
				</button>
			</div>
			<div class="filters">
				<input type="text" id="searchInput" placeholder="🔍 Поиск по ФИО" />
				<select id="departmentFilter">
					<option value="">Все отделы</option>
				</select>
				<select id="positionFilter">
					<option value="">Все должности</option>
				</select>
				<button onclick="applyFilters()" class="btn">Применить</button>
			</div>
			<table class="employee-table">
				<thead>
					<tr>
						<th>ФИО</th>
						<th>Дата рождения</th>
						<th>Паспорт</th>
						<th>Контакты</th>
						<th>Адрес</th>
						<th>Отдел</th>
						<th>Должность</th>
						<th>Зарплата</th>
						<th>Дата приема</th>
						<th>Статус</th>
						<th>Действия</th>
					</tr>
				</thead>
				<tbody id="employeeTableBody"></tbody>
			</table>
		</div>
		<div id="fireModal" class="modal">
			<div class="modal-content">
				<h3>Подтверждение увольнения</h3>
				<p>
					Вы уверены, что хотите уволить сотрудника
					<span id="fireEmployeeName"></span>?
				</p>
				<button onclick="confirmFire()" class="btn btn-danger">Уволить</button>
				<button onclick="closeModal()" class="btn">Отмена</button>
			</div>
		</div>
		<script src="assets/js/script.js"></script>
	</body>
</html>
